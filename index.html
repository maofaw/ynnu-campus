<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云师大校园地图</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 搜索栏 -->
  <div id="search-bar">
    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="🔍 搜索教学楼、食堂、宿舍..." autocomplete="off">
      <ul id="search-results"></ul>
    </div>
  </div>

  <!-- 地图容器 -->
  <div id="map-container"></div>

  <!-- 建筑详情侧边栏 -->
  <div id="detail-panel" class="detail-hidden">
    <div id="detail-content"></div>
    <button id="detail-close">&times;</button>
  </div>

  <!-- 高德地图 JS API（安全密钥必须在地图脚本之前声明） -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'a596b54c4cf3f4bda610e07acf349c95'
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=5001e1f6633447cc4b019a5c703970d2"></script>
  <!-- CloudBase 云开发 SDK -->
  <script src="https://web.sdk.qcloud.com/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
